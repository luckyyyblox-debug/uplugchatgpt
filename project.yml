
name: Unplug

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Unplug:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.unplug
        GENERATE_INFOPLIST_FILE: YES
